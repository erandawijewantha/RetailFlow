version: '3.8'
# ============================================================================
# RETAILFLOW - DOCKER COMPOSE
# ============================================================================
# This file defines all services needed for the RetailFlow data platform.
# Run with: docker-compose up -d
# ============================================================================

services:
  # ==========================================================================
  # DATABASES
  # ==========================================================================
  
  # PostgreSQL for Airflow metadata
  postgres-airflow:
    image: postgres:15-alpine
    container_name:  retailflow-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailflow-networks
  
  # PostgreSQL for Data Warehouse
  postgres-warehouse:
    image: postgres:15-alpine
    container_name: retailflow-warehouse
  environment:
    POSTGRES_USER: warehouse
    POSTGRES_PASSWORD: warehouse123
    POSTGRES_DB: retailflow
  volumes:
    - postgres-warehouse-data:/var/lib/postgresql/data
    - ./init-scripts:/docker-entrypoint-initdb.d
  ports:
    - "5433:5432"
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "warehouse"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - retailflow-network

  # ==========================================================================
  # OBJECT STORAGE (S3-Compatible Data Lake)
  # ==========================================================================
  
  minio:
    image: minio/minio:latest
    container_name: retailflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - retailflow-network
    
  # Initialize MinIO buckets
  mini-init:
    image: minio/mc:latest
    container_name: retailflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/retailflow --ignore-existing;
      mc mb myminio/retailflow/bronze --ignore-existing;
      mc mb myminio/retailflow/silver --ignore-existing;
      mc mb myminio/retailflow/gold --ignore-existing;
      mc anonymous set download myminio/retailflow;
      echo 'MinIO buckets created sucessfully';
      exit 0;
      "
    networks:
      - retailflow-network 

  # ==========================================================================
  # APACHE SPARK
  # ==========================================================================
  spark-master:
    image: bitnami/spark:3.5
    container_name: retailflow-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark Master
    volumes:
      - ../spark/jobs:/opt/spark/jobs
      - ../spark/lib:/opt/spark/lib
      - ../data:/opt/spark/data
    networks:
      - retailflow-network

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: retailflow-spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ../spark/jobs:/opt/spark/jobs
      - ../spark/lib:/opt/spark/lib
      - ../data:/opt/spark/data
    networks:
      - retailflow-network

  # ==========================================================================
  # APACHE AIRFLOW
  # ==========================================================================

  airflow-init:
    image: apache/airflow:2.8.0-python3.10
    container_name: retailflow-airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here-must-be-32-bytes
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-here
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      postgres-airflow:
        condition: service_healthy
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@retailflow.com || true
      "
    networks:
      - retailflow-network

  airflow-webserver:
    image: apache/airflow:2.8.0-python3.10
    container_name: retailflow-airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here-must-be-32-bytes
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-here
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow webserver
    ports:
      - "8081:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/config:/opt/airflow/config
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - retailflow-network

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.10
    container_name: retailflow-airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here-must-be-32-bytes
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-here
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/config:/opt/airflow/config
      - airflow-logs:/opt/airflow/logs
    networks:
      - retailflow-network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres-airflow-data:
  postgres-warehouse-data:
  minio-data:
  airflow-logs:

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  retailflow-network:
    driver: bridge